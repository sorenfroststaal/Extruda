name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the security policy on every page and installer checksums
        run: |
          node design-system/tools/csp.cjs --check
          node design-system/tests/downloads.cjs
      - name: Install Playwright and Chromium (test tools only)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Check contrast on every page in light and dark mode
        env:
          EXTRUDA_BROWSER_CHANNEL: chromium
        run: node design-system/tests/contrast.cjs
      - name: Check header controls on 10 pages (language, theme, About, keyboard, mobile)
        env:
          EXTRUDA_BROWSER_CHANNEL: chromium
        run: node design-system/tests/header.cjs
      - name: Check reference app, home page and Projekter
        env:
          EXTRUDA_BROWSER_CHANNEL: chromium
        run: node design-system/tests/browser.cjs
