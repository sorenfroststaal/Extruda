name: Publish extruda.dk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build the existing Jekyll site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - name: Check site artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          site = Path('_site')
          assert (site / 'index.html').is_file(), 'Missing homepage'
          assert Path('CNAME').read_text().strip() == 'extruda.dk', 'Unexpected source domain'
          if (site / 'CNAME').exists():
              assert (site / 'CNAME').read_text().strip() == 'extruda.dk', 'Unexpected built domain'
          for name in ['index.html', 'gallery.json', 'array-bom-en.csv', 'array-bom-da.csv']:
              source = Path('arraylampshade') / name
              built = site / 'arraylampshade' / name
              assert built.is_file(), f'Missing Array file: {name}'
              assert hashlib.sha256(source.read_bytes()).digest() == hashlib.sha256(built.read_bytes()).digest(), f'Build changed Array file: {name}'
          files = [p for p in site.rglob('*') if p.is_file()]
          links = [p for p in site.rglob('*') if p.is_symlink()]
          assert not links, 'Pages artifact cannot contain symbolic links'
          total = sum(p.stat().st_size for p in files)
          assert total < 10 * 1024**3, 'Pages artifact exceeds 10 GB'
          print(f'Validated site: {len(files)} files, {total:,} bytes; Array matches checkout.')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: 1800000

