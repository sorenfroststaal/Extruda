<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Beskyttet side · Extruda</title>
<link rel="stylesheet" href="../design-system/styles.css">
<link rel="stylesheet" href="../css/extruda-ui.css">
<script defer src="../js/extruda-ui.js"></script>
<style>
main.taf{max-width:1200px;margin:auto;padding:0 32px 64px}
.lock{max-width:520px;margin:64px auto;padding:24px;border:1px solid var(--border);border-radius:var(--radius-panel);background:var(--surface)}
.lock h1{margin:0 0 8px;font:800 32px/1.2 var(--font-heading)}.lock p{color:var(--muted);margin:0 0 24px}
.lock label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.lock input{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--field-border);border-radius:var(--radius-control);background:var(--surface);color:var(--text);font:inherit}
.btn{min-height:48px;padding:10px 20px;border-radius:var(--radius-control);border:1px solid var(--action);background:var(--action);color:var(--action-text);font:600 16px var(--font-body);cursor:pointer}
.btn.secondary{background:transparent;color:var(--action)}
.btn:focus-visible,.chip:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.lock .btn{margin-top:16px;width:100%}.err{color:var(--error);font-size:14px;margin-top:12px;min-height:20px}
.head{padding:40px 0 24px;max-width:860px}.head .eyebrow{color:var(--action);font-weight:700;margin:0 0 8px}
.head h1{margin:0 0 16px;font:800 clamp(28px,4vw,40px)/1.15 var(--font-heading)}.head p{margin:0;font-size:17px}
.updated{color:var(--muted);font-size:13px;margin-top:12px!important}
h2.sec{font:800 24px/1.25 var(--font-heading);margin:48px 0 16px}
.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.status article{padding:20px;border:1px solid var(--border);border-radius:var(--radius-panel);background:var(--surface)}
.status h3{margin:0 0 8px;font-size:15px}.status p{margin:8px 0 0;font-size:14px;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:var(--radius-small);font-size:13px;font-weight:700;background:var(--surface-soft);border:1px solid var(--border)}
.pill.hjemvist{background:var(--apricot);color:#343B3B;border-color:var(--apricot)}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 0;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .grp{display:flex;flex-wrap:wrap;gap:8px;margin-right:16px}
.chip{min-height:44px;padding:8px 14px;border-radius:var(--radius-control);border:1px solid var(--field-border);background:var(--surface);color:var(--text);font:500 14px var(--font-body);cursor:pointer}
.chip[aria-pressed=true]{background:var(--action);border-color:var(--action);color:var(--action-text)}
.filters input[type=search]{min-height:44px;padding:8px 12px;border:1px solid var(--field-border);border-radius:var(--radius-control);background:var(--surface);color:var(--text);font:inherit;flex:1 1 220px}
.count{font-size:13px;color:var(--muted);width:100%}
.timeline{position:relative;margin:24px 0 0;padding:0;list-style:none}
.timeline::before{content:"";position:absolute;left:118px;top:0;bottom:0;width:2px;background:var(--border)}
.year{margin:32px 0 8px 0;font:800 22px var(--font-heading);color:var(--action);padding-left:0}
.ev{display:grid;grid-template-columns:100px 36px minmax(0,1fr);gap:0;margin:0 0 12px}
.ev .when{font-size:13px;color:var(--muted);padding-top:18px;text-align:right;padding-right:8px}
.ev .dot{position:relative}.ev .dot span{position:absolute;left:12px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--teal)}
.ev[data-actor=kommune] .dot span{border-color:var(--petrol)}.ev[data-actor=familie] .dot span{border-color:var(--apricot)}.ev[data-actor=ast] .dot span{border-color:var(--graphite);background:var(--apricot)}.ev[data-actor=andre] .dot span{border-color:var(--muted)}
[data-theme=dark] .ev[data-actor=ast] .dot span{border-color:var(--cream)}
.ev details{border:1px solid var(--border);border-radius:var(--radius-panel);background:var(--surface)}
.ev.key details{border:2px solid var(--action)}
.ev summary{list-style:none;cursor:pointer;padding:14px 20px;min-height:44px}
.ev summary::-webkit-details-marker{display:none}
.ev summary .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted);margin-bottom:4px}
.ev summary h3{margin:0;font:700 17px/1.35 var(--font-heading)}
.ev summary h3::after{content:" +";color:var(--action)}.ev details[open] summary h3::after{content:" –"}
.ev .body{padding:0 20px 16px;font-size:15px}.ev .body p{margin:0 0 10px}
.src{font-size:13px;color:var(--muted)}.flag{display:inline-block;font-size:12px;font-weight:700;color:#343B3B;background:var(--apricot);padding:1px 8px;border-radius:var(--radius-small)}
.qlink{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;color:var(--action)}
.versions{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-panel);overflow:hidden}
.versions th,.versions td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:top;font-size:15px}
.versions th{font-size:13px;color:var(--muted);background:var(--surface-soft)}
ul.conf{padding-left:20px}ul.conf li{margin-bottom:8px}
.qs{display:grid;gap:16px}.q{padding:20px;border:1px solid var(--border);border-radius:var(--radius-panel);background:var(--surface)}
.q label{display:block;font-weight:700;margin-bottom:4px}.q .why{font-size:13px;color:var(--muted);margin:0 0 8px}
.q textarea{width:100%;min-height:88px;padding:10px 12px;border:1px solid var(--field-border);border-radius:var(--radius-control);background:var(--surface);color:var(--text);font:inherit;resize:vertical}
.q .saved{font-size:12px;color:var(--success);min-height:16px;margin-top:4px}
.q:target{outline:3px solid var(--apricot)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.list{list-style:none;padding:0;margin:0;border-top:1px solid var(--border)}.list li{padding:12px 0;border-bottom:1px solid var(--border);font-size:15px}.list b{display:block}
.note{font-size:13px;color:var(--muted);margin-top:32px}
@media(max-width:959px){.status{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media(max-width:640px){main.taf{padding:0 16px 48px}.timeline::before{left:10px}.ev{grid-template-columns:28px minmax(0,1fr)}.ev .when{display:none}.ev .dot span{left:3px}.ev .mobilewhen{display:inline}.filters{position:static}}
.mobilewhen{display:none}
@media print{.filters,.site-header,.actions,.lock{display:none}.ev details{break-inside:avoid}}
</style>
</head>

<template id="extruda-about">
<p data-da="Indholdet på denne side er krypteret med AES-256-GCM. Nøglen udledes af adgangskoden med PBKDF2-SHA-256 (600.000 runder). Den offentlige fil på extruda.dk indeholder kun krypteret tekst. Dekrypteringen sker i din browser, og adgangskoden sendes ingen steder hen." data-en="The content of this page is encrypted with AES-256-GCM. The key is derived from the password with PBKDF2-SHA-256 (600,000 rounds). The public file on extruda.dk contains only ciphertext. Decryption happens in your browser and the password is not sent anywhere."></p>
<p data-da="Svar på de åbne spørgsmål gemmes kun lokalt i denne browser (localStorage), ukrypteret, og deles ikke med nogen. Brug 'Kopiér svar' eller 'Hent svar' for at tage dem med. Indholdet findes kun på dansk." data-en="Answers to the open questions are stored only locally in this browser (localStorage), unencrypted, and are not shared. Use 'Copy answers' or 'Download answers' to take them with you. The content is in Danish only."></p>
<p data-da="Ingen eksterne afhængigheder. Kræver en moderne browser med Web Crypto. Siden er en sammenfatning af sagens akter og ikke juridisk rådgivning." data-en="No external dependencies. Requires a modern browser with Web Crypto. The page summarises case documents and is not legal advice."></p>

const ITER=600000;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){const raw=b64(PAYLOAD),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)));}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS='taf-svar-v1';
function loadAns(){try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){return {}}}
function saveAns(a){try{localStorage.setItem(LS,JSON.stringify(a));return true}catch(e){return false}}
document.getElementById('lock').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('err'),btn=e.target.querySelector('button');
err.textContent='';btn.disabled=true;btn.textContent='Åbner …';
try{const d=await decrypt(document.getElementById('pw').value);render(d);}catch(x){err.textContent='Forkert adgangskode, eller siden kunne ikke åbnes.';btn.disabled=false;btn.textContent='Åbn siden';document.getElementById('pw').select();}});
function render(D){document.title=D.title+' · Extruda';const app=document.getElementById('app');const qmap=Object.fromEntries(D.questions.map((q,i)=>[q.id,i+1]));
const ans=loadAns();
const st=D.status.map(s=>`<article><span class="pill ${s.state==='Hjemvist'?'hjemvist':''}">${esc(s.state)}</span><h3 style="margin-top:10px">${esc(s.label)}</h3><p>${esc(s.text)}</p></article>`).join('');
const trackBtns=Object.entries(D.tracks).map(([k,v])=>`<button type="button" class="chip" data-track="${k}" aria-pressed="true">${esc(v)}</button>`).join('');
const actorBtns=Object.entries(D.actors).map(([k,v])=>`<button type="button" class="chip" data-actor="${k}" aria-pressed="true">${esc(v)}</button>`).join('');
let lastY='',tl='';
D.events.slice().sort((a,b)=>a.d<b.d?-1:1).forEach((e,i)=>{const y=e.d.slice(0,4);if(y!==lastY){tl+=`<li class="year" data-year="${y}">${y}</li>`;lastY=y;}
tl+=`<li class="ev ${e.key?'key':''}" data-track="${e.track}" data-actor="${e.actor}" data-text="${esc((e.title+' '+e.text+' '+e.date).toLowerCase())}"><div class="when">${esc(e.date)}</div><div class="dot"><span></span></div>
<details ${e.key?'open':''}><summary><div class="meta"><span class="mobilewhen">${esc(e.date)} ·</span><span>${esc(D.actors[e.actor])}</span><span>· ${esc(D.tracks[e.track])}</span>${e.flag?`<span class="flag">${esc(e.flag)}</span>`:''}</div><h3>${esc(e.title)}</h3></summary>
<div class="body"><p>${esc(e.text)}</p><p class="src">Kilde: ${esc(e.source)}</p>${e.question?`<a class="qlink" href="#${e.question}">❓ Åbent spørgsmål ${qmap[e.question]}</a>`:''}</div></details></li>`;});
const vers=D.versions.map(v=>`<tr><td>${esc(v.date)}</td><td>${esc(v.who)}</td><td>${esc(v.text)}</td></tr>`).join('');
const qs=D.questions.map((q,i)=>`<div class="q" id="${q.id}"><label for="a-${q.id}">${i+1}. ${esc(q.q)}</label><p class="why">${esc(q.why)}</p><textarea id="a-${q.id}" data-q="${q.id}" placeholder="Skriv svar her">${esc(ans[q.id]||'')}</textarea><div class="saved" aria-live="polite"></div></div>`).join('');
app.innerHTML=`<section class="head"><p class="eyebrow">Sagsoverblik · fortroligt</p><h1>${esc(D.title)}</h1><p>${esc(D.summary)}</p><p class="updated">Opdateret ${esc(D.updated)} ud fra ${esc(D.sources)}. Ikke juridisk rådgivning.</p></section>
<h2 class="sec">Hvor står sagerne nu</h2><div class="status">${st}</div>
<h2 class="sec" id="tidslinje">Tidslinje</h2>
<div class="filters" role="group" aria-label="Filtre"><div class="grp" aria-label="Spor">${trackBtns}</div><div class="grp" aria-label="Aktør">${actorBtns}</div><input type="search" id="q" placeholder="Søg i tidslinjen" aria-label="Søg i tidslinjen"><button type="button" class="chip" id="openall">Fold alle ud</button><span class="count" id="count" aria-live="polite"></span></div>
<ol class="timeline" id="tl">${tl}</ol>
<h2 class="sec" id="uoverensstemmelser">Uoverensstemmelser i oplysningerne</h2>
<p>${esc(D.versionsIntro)}</p>
<div style="overflow-x:auto"><table class="versions"><thead><tr><th>Dato</th><th>Hvem</th><th>Beskrivelse af arbejdstiderne</th></tr></thead><tbody>${vers}</tbody></table></div>
<h3 style="margin:24px 0 8px;font:700 18px var(--font-heading)">Andre punkter, der bør afklares</h3><ul class="conf">${D.otherConflicts.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
<h2 class="sec" id="spoergsmaal">Åbne spørgsmål</h2>
<p>Svarene kan udfylde hullerne i forløbet. De gemmes kun i denne browser.</p>
<div class="qs">${qs}</div>
<div class="actions"><button type="button" class="btn" id="copy">Kopiér svar</button><button type="button" class="btn secondary" id="dl">Hent svar som tekst</button><span id="amsg" class="src" aria-live="polite"></span></div>
<h2 class="sec">Næste skridt efter hjemvisningen</h2><ul class="conf">${D.next.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
<div class="two"><div><h2 class="sec">Personer</h2><ul class="list">${D.people.map(p=>`<li><b>${esc(p[0])}</b>${esc(p[1])}</li>`).join('')}</ul></div>
<div><h2 class="sec">Regler der henvises til</h2><ul class="list">${D.law.map(p=>`<li><b>${esc(p[0])}</b>${esc(p[1])}</li>`).join('')}</ul></div></div>
<p class="note">CPR-numre er udeladt. Datoer og citater er hentet fra kilderne under hvert punkt. Notater fra kommunen gengiver kommunens opfattelse.</p>`;
const tlEl=document.getElementById('tl');
function apply(){const tr=[...document.querySelectorAll('[data-track][aria-pressed=true]')].map(b=>b.dataset.track),ac=[...document.querySelectorAll('.chip[data-actor][aria-pressed=true]')].map(b=>b.dataset.actor),q=document.getElementById('q').value.trim().toLowerCase();
let n=0;tlEl.querySelectorAll('.ev').forEach(li=>{const ok=tr.includes(li.dataset.track)&&ac.includes(li.dataset.actor)&&(!q||li.dataset.text.includes(q));li.hidden=!ok;if(ok)n++;});
tlEl.querySelectorAll('.year').forEach(y=>{let s=y.nextElementSibling,vis=false;while(s&&!s.classList.contains('year')){if(!s.hidden)vis=true;s=s.nextElementSibling;}y.hidden=!vis;});
document.getElementById('count').textContent=`Viser ${n} af ${D.events.length} begivenheder`;}
document.querySelectorAll('.filters .chip[data-track],.filters .chip[data-actor]').forEach(b=>b.addEventListener('click',()=>{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');apply();}));
document.getElementById('q').addEventListener('input',apply);
document.getElementById('openall').addEventListener('click',e=>{const open=e.target.textContent==='Fold alle ud';tlEl.querySelectorAll('details').forEach(d=>d.open=open);e.target.textContent=open?'Fold alle sammen':'Fold alle ud';});
let t;document.querySelectorAll('.q textarea').forEach(ta=>ta.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{const a=loadAns();a[ta.dataset.q]=ta.value;const ok=saveAns(a);ta.nextElementSibling.textContent=ok?'Gemt i denne browser':'Kunne ikke gemme (browserlager er blokeret). Kopiér svaret, før du lukker siden.';},400);}));
const txt=()=>D.questions.map((q,i)=>`${i+1}. ${q.q}\n${(document.getElementById('a-'+q.id).value||'(ikke besvaret)')}\n`).join('\n');
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(txt());document.getElementById('amsg').textContent='Svarene er kopieret.';}catch(e){document.getElementById('amsg').textContent='Kopiering blev blokeret. Brug "Hent svar som tekst".';}});
document.getElementById('dl').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt()],{type:'text/plain;charset=utf-8'}));a.download='TAF-svar.txt';a.click();});
apply();document.getElementById('app').querySelector('h1').setAttribute('tabindex','-1');document.getElementById('app').querySelector('h1').focus();}
</script>
</body>
</html>
